name: Build EdgeTX X9D+ STM32F427 Firmware

on:
  push:
    branches:
      - 'x9dp-f427'
  workflow_dispatch:

jobs:
  build:
    name: Build X9D+ F427 (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.10.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CN
            lang: CN
            nv3007: "OFF"
            fw_name: edgetx-x9dp-f427-cn
            bl_name: bootloader-x9dp-f427
          - name: EN
            lang: EN
            nv3007: "OFF"
            fw_name: edgetx-x9dp-f427-en
            bl_name: bootloader-x9dp-f427
          - name: NV3007_CN
            lang: CN
            nv3007: "ON"
            fw_name: edgetx-x9dp-f427-nv3007-cn
            bl_name: bootloader-x9dp-f427-nv3007
          - name: NV3007_EN
            lang: EN
            nv3007: "ON"
            fw_name: edgetx-x9dp-f427-nv3007-en
            bl_name: bootloader-x9dp-f427-nv3007

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure safe directory for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build firmware and bootloader
        run: |
          echo "=========================================="
          echo "Starting Build for X9D+ F427 (${{ matrix.name }})"
          echo "  TRANSLATIONS=${{ matrix.lang }}, NV3007_LCD=${{ matrix.nv3007 }}"
          echo "=========================================="

          mkdir -p build && cd build

          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_RULE_MESSAGES=OFF \
            -Wno-dev \
            -DPCB=X9D+ \
            -DDEFAULT_MODE=2 \
            -DGVARS=YES \
            -DHELI=YES \
            -DLUA=YES \
            -DLUA_MIXER=YES \
            -DMULTIMODULE=YES \
            -DCROSSFIRE=YES \
            -DGHOST=YES \
            -DDISABLE_MCUCHECK=ON \
            -DTRANSLATIONS=${{ matrix.lang }} \
            -DNV3007_LCD=${{ matrix.nv3007 }} \
            ..

          echo "Configuring arm-none-eabi..."
          cmake --build . --target arm-none-eabi-configure

          echo "Compiling firmware and checking memory size report..."
          cmake --build arm-none-eabi -j$(nproc) --target firmware-size

          echo "Preparing artifact outputs..."
          mkdir -p ../artifacts
          cp arm-none-eabi/firmware.bin "../artifacts/${{ matrix.fw_name }}.bin"
          cp arm-none-eabi/bootloader.bin "../artifacts/${{ matrix.bl_name }}.bin"
          cp arm-none-eabi/firmware.elf "../artifacts/${{ matrix.fw_name }}.elf"

          ls -la ../artifacts/
          echo "Bootloader exact size: $(stat -c%s arm-none-eabi/bootloader.bin) bytes (limit 32768)"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgetx-x9dp-f427-${{ matrix.name }}
          path: artifacts/
